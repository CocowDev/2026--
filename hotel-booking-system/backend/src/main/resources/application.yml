server:
  port: 3001
  # 监听所有网卡地址，放开局域网访问（其他电脑/手机可访问后端接口）
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hotel.booking.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: hotel_booking_jwt_secret_key_2026
  expiration: 604800000